# Published files must be portable across machines.

rules:
  - id: no-internal-document-reference
    message: >-
      Published files must not contain machine-local home paths.
      Use a portable path or state the contract in place instead.
    severity: ERROR
    languages: [generic]
    pattern-regex: >-
      (/Users/[A-Za-z0-9_.-]+/(Projects|Desktop|Documents)/|/home/[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]*)
    paths:
      exclude:
        - "**/vendor/**"
        - dist
        - .tmp
        - .venv
