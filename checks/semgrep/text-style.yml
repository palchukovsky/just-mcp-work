# Text style and hygiene across the whole tree: source, docs, config.
#
# Generic pattern-regex rules, so no paths.include - every text file Semgrep
# can read is in scope. The byte-content rules exclude *_test.go: this
# project's tests exercise UTF-8 and unicode edge cases deliberately (see
# internal/runstore/store_test.go), so invisible-character/emoji findings
# inside test fixtures would be noise rather than a real defect.
#
# ascii-punctuation-only is active in
# checks/semgrep/ascii-punctuation.yml.

rules:
  - id: no-invisible-characters
    message: >-
      Invisible or zero-width characters are not allowed in source. They are
      unreadable in review, survive copy-paste, and are a known vector for
      hidden text and homoglyph confusion.
    severity: ERROR
    languages: [generic]
    pattern-regex: '[\x{200B}-\x{200F}\x{2060}-\x{2064}\x{2066}-\x{206F}]'
    paths:
      exclude:
        - "**/*_test.go"
        - "**/vendor/**"
        - dist
        - .tmp
        - .venv

  - id: no-emoji-in-source
    message: >-
      Emoji do not belong in source: they are not searchable, render
      unpredictably, and carry no meaning a word cannot.
    severity: ERROR
    languages: [generic]
    pattern-regex: '[\x{1F300}-\x{1FAFF}\x{2700}-\x{27BF}]'
    paths:
      exclude:
        - "**/*_test.go"
        - "**/vendor/**"
        - dist
        - .tmp
        - .venv

  - id: no-conversational-comments
    message: >-
      Comments state why, not narrate. Drop conversational and hedging openers
      ("Note that", "It is important to", "Let's", "In summary") and apologetic
      or first-person phrasing - they add length without adding information.
    severity: ERROR
    languages: [generic]
    pattern-regex: >-
      (?i)(//|#)\s*(note that|it'?s important to|it is important to|it is
      worth noting|this ensures that|let'?s |in summary|overall,|as we can
      see|i cannot|i'?m sorry|i apologize)
    paths:
      exclude:
        - "**/vendor/**"
        - dist
        - .tmp
        - .venv
