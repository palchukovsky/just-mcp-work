# Private tracker identifiers across source and documentation. Rejects
# tracker-style issue references and TODO forms. See checks/README.md.

rules:
  - id: no-tracker-ids-in-code
    message: >-
      Issue identifiers do not belong in source. They rot when the tracker
      changes and mean nothing to a reader without access to that tracker.
      Describe the pending work in words instead.
    severity: ERROR
    languages: [generic]
    patterns:
      - pattern-regex: '\b[A-Z]{2,10}-\d+\b|TODO\([^)]*-\d+\)'
      # UTF-8 is a text-encoding name, not a tracker reference; it is the one
      # false positive this pattern hits in the current tree.
      - pattern-not-regex: '\bUTF-\d+\b'
    paths:
      exclude:
        - "**/vendor/**"
        - dist
        - .tmp
        - .venv
        - CHANGELOG.md
